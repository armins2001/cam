name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # اکشن رسمی Google برای نصب SDK
    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    # نصب build-tools و platform مورد نیاز Gradle
    - name: Install required build tools
      run: |
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    # نصب Gradle
    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # اجرای بیلد همراه با لاگ کامل
    - name: Build APK
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info --no-daemon
        else
          cd camera_project
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --info --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camera_app
        path: "**/build/outputs/apk/debug/*.apk"
