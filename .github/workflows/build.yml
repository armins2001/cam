name: Final Production Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Create Environment Properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

      - name: 4. Setup Android SDK & Licenses
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: 5. Install Required Components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 6. Setup Gradle 8.7 (Standalone)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: 7. Run Build Command
        run: gradle assembleDebug --stacktrace

      - name: 8. Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-App-Release
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
