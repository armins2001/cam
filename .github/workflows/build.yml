name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # نصب ابزارهای SDK اندروید
    - name: Install Android SDK
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip -d android-sdk
        yes | android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk licenses
        yes | android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk "build-tools;34.0.0" "platforms;android-34" "platform-tools"
        echo "sdk.dir=$GITHUB_WORKSPACE/android-sdk" > local.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build with Gradle (debug mode on)
      run: |
        if [ -f "build.gradle" ]; then
          gradle assembleDebug --stacktrace --info --no-daemon
        else
          cd camera_project && gradle assembleDebug --stacktrace --info --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camera-app-debug
        path: "**/build/outputs/apk/debug/*.apk"
