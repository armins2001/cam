name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # این مرحله جادویی است؛ خودش Gradle نسخه 8.7 را نصب می‌کند
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build with Gradle 8.7
      run: |
        # پیدا کردن مسیر پروژه و اجرای دستور ساخت
        if [ -f "build.gradle" ]; then
          gradle assembleDebug
        else
          cd camera_project && gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: camera-app-debug
        path: "**/build/outputs/apk/debug/*.apk"
