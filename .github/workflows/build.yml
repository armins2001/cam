name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Debug - List Files
        run: ls -R

      - name: Build APK with Gradle
        run: |
          # بررسی می‌کنیم اگر پوشه camera_project وجود داشت واردش شو
          if [ -d "camera_project" ]; then
            cd camera_project
          fi
          
          # اجرای بیلد با استفاده از نسخه سیستمی Gradle که نصب کردیم
          gradle assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
